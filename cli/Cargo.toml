[package]
name = "xerxes"
version = "0.3.0"
edition = "2021"
authors = ["tryhard"]
description = "High-performance filesystem navigation engine"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/tryhard-26/xerxes"

[[bin]]
name = "_xerxes"
path = "src/main.rs"

[[bin]]
name = "_xerxesd"
path = "src/bin/xerxesd.rs"

[dependencies]
xerxes-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
